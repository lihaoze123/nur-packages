name: "Build and populate cache"
on:
  pull_request:
  push:
    branches:
      - main
      - master
  schedule:
    # Rebuild daily at 03:17 UTC.
    # TIP: Choose a random time here so not all repositories are build at once:
    # https://www.random.org/clock-times/?num=1&earliest=01%3A00&latest=08%3A00&interval=5&format=html&rnd=new
    - cron:  '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        nixPath:
          - nixpkgs=https://github.com/NixOS/nixpkgs/archive/refs/heads/nixpkgs-unstable.tar.gz
          - nixpkgs=https://github.com/NixOS/nixpkgs/archive/refs/heads/nixos-unstable.tar.gz
          - nixpkgs=https://github.com/NixOS/nixpkgs/archive/refs/heads/nixos-26.05.tar.gz
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
    - name: Install nix
      uses: cachix/install-nix-action@v31
      with:
        nix_path: "${{ matrix.nixPath }}"
        extra_nix_config: |
          experimental-features = nix-command flakes
          access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
    - name: Show nixpkgs version
      run: nix-instantiate --eval -E '(import <nixpkgs> {}).lib.version'
    - name: Setup cachix
      uses: cachix/cachix-action@v16
      # Optional: set CACHIX_NAME and a signing key/token to enable uploads.
      if: ${{ vars.CACHIX_NAME != '' }}
      with:
        name: ${{ vars.CACHIX_NAME }}
        signingKey: '${{ secrets.CACHIX_SIGNING_KEY }}'
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
    - name: Check evaluation
      run: |
        nix-env -f . -qa \* --meta --xml \
          --allowed-uris https://static.rust-lang.org \
          --option restrict-eval true \
          --option allow-import-from-derivation true \
          --drv-path --show-trace \
          -I nixpkgs=$(nix-instantiate --find-file nixpkgs) \
          -I $PWD
    - name: Trigger NUR update
      # Enable NUR_REGISTERED after this repository enters the public index.
      if: ${{ github.event_name == 'push' && vars.NUR_REGISTERED == 'true' }}
      run: curl -XPOST "https://nur-update.nix-community.org/update?repo=lihaoze123"

  cache-pinned:
    if: github.event_name != 'pull_request'
    concurrency:
      group: nur-attic-cache
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes
          extra-substituters = https://niri-computer-use.cachix.org https://codex-desktop-linux.cachix.org
          extra-trusted-public-keys = niri-computer-use.cachix.org-1:K5LGfljid+PkRn02OLbwsmngqBCoLkbDi9hRMCnsOTg= codex-desktop-linux.cachix.org-1:nX/xy6AdK9hQE24A8ALGjkCKj2ObFmcnemiL5Cid4nk=
    - name: Configure private cache reads
      env:
        ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
      run: |
        : "${ATTIC_TOKEN:?}"
        umask 077
        printf 'machine cache.chumeng.xyz login attic password %s\n' "$ATTIC_TOKEN" > "$RUNNER_TEMP/attic-netrc"
        sudo install -Dm600 "$RUNNER_TEMP/attic-netrc" /etc/nix/attic-netrc
        echo 'netrc-file = /etc/nix/attic-netrc' | sudo tee -a /etc/nix/nix.conf > /dev/null
        echo 'extra-substituters = https://cache.chumeng.xyz/nur' | sudo tee -a /etc/nix/nix.conf > /dev/null
        echo 'extra-trusted-public-keys = nur:dJh05Op2+iv3GCHoaF2+1FfQtqcUZzf/4v/ZTaLHomY=' | sudo tee -a /etc/nix/nix.conf > /dev/null
        sudo systemctl restart nix-daemon
    - name: Build the locked package outputs
      run: |
        nix build --impure --file ci-pinned.nix buildOutputs --no-link --json > "$RUNNER_TEMP/nur-build.json"
        jq -r '.[].outputs[]' "$RUNNER_TEMP/nur-build.json" > "$RUNNER_TEMP/nur-paths"
    - name: Check the complete flake after source IFD is materialized
      run: nix flake check --no-build
    - name: Publish outputs to the private Attic cache
      env:
        ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
      run: |
        nix shell --inputs-from . nixpkgs#attic-client -c bash scripts/cache-attic.sh "$RUNNER_TEMP/nur-paths"
